sla:
  priority_1: 4
  priority_2: 8
  priority_3: 24
  priority_4: 48

points:
  priority:
    P1: 50
    P2: 30
    P3: 20
    P4: 10

gamification:

  points:

    incident_closed: 10

    sla_met: 20

    first_call_resolution: 25

    high_priority_bonus: 30

    customer_rating_bonus: 15

    reopen_penalty: -10

    reassignment_penalty: -5
  
  badges:

    legend:
      min_points: 1000

    platinum:
      min_points: 750

    gold:
      min_points: 500

    silver:
      min_points: 300

    bronze:
      min_points: 100

    rookie:
      min_points: 0

  levels:

    level_1:
      name: Beginner
      min_points: 0

    level_2:
      name: Explorer
      min_points: 100

    level_3:
      name: Performer
      min_points: 250

    level_4:
      name: Expert
      min_points: 500

    level_5:
      name: Master
      min_points: 750

    level_6:
      name: Champion
      min_points: 1000
  
  leaderboard:

    top_n: 10

    sort_by:
      - total_points
      - level
      - total_incidents
      - average_resolution
      
  achievements:

    incident_master:
      incidents: 100

    point_master:
      points: 1000

    sla_champion:
      sla: 100

    speed_star:
      mttr: 4

    elite_level:
      level: 6

    top_rank:
      rank: 1
      
  monthly_ranking:

    top_n: 10

    ranking_columns:

      - total_points
      - total_incidents
      - average_resolution

machine_learning:

  target_column: sla_status

  test_size: 0.20

  random_state: 42

  categorical_columns:

    - priority
    - assignment_group
    - assigned_to
    - state

  feature_columns:

    - priority
    - assignment_group
    - assigned_to
    - resolution_hours
    - reopen_count
    - reassignment_count
    - points
    - level

  scaling : standard
  create_features: True
  save_scaler: True
  date_column: opened_at  

model_training:


  random_forest:
      n_estimators: 200
      max_depth: 10
      min_samples_split: 2
      min_samples_leaf: 1
      max_features: "sqrt"
      bootstrap: true
      random_state: 42

  xgboost:
    objective: "binary:logistic"
    eval_metric: "logloss"
    learning_rate: 0.1
    max_depth: 6
    n_estimators: 200
    subsample: 0.8
    colsample_bytree: 0.8
    gamma: 0
    min_child_weight: 1
    random_state: 42

  svm:
    C: 1.0
    kernel: "rbf"
    gamma: "scale"
    probability: true
    random_state: 42

  logistic_regression:
    C: 1.0
    solver: "liblinear"
    max_iter: 1000
    random_state: 42

  decision_tree:
    criterion: "gini"
    max_depth: 10
    min_samples_split: 2
    min_samples_leaf: 1
    random_state: 42

  knn:
    n_neighbors: 5
    weights: "uniform"
    metric: "minkowski"

  gradient_boosting:
    learning_rate: 0.1
    n_estimators: 200
    max_depth: 3
    random_state: 42


predict_workload:

  target_column: sla_status
  test_size: 0.20

  random_state: 42

  high_workload: 0.80
  medium_workload: 0.50
  
  feature_columns:

    - priority
    - assignment_group
    - assigned_to
    - resolution_hours
    - reopen_count
    - reassignment_count
    - points
    - level
    - hour
    - day
    - weekday
    - month
    - complexity
    - priority_score
